# gitleaks configuration for atcr.
#
# Extends the stock ruleset — this file only adds allowlist entries for
# confirmed false positives. It never disables a rule.

[extend]
useDefault = true

[[rules]]
# Placeholder so the allowlist below applies globally rather than per-rule.
id = "atcr-noop-placeholder"
description = "Never matches; present only so this file is a valid ruleset extension."
regex = '''\$\^atcr-never-matches\$'''

[allowlist]
description = "Confirmed false positives"

regexes = [
  # TimescaleDB names its internal chunk tables _hyper_<hypertable>_<chunk>_chunk.
  # These appear verbatim in EXPLAIN-plan output inside vendored benchmark diffs
  # (benchmarks/standard-v1/timescale-timescaledb-pr-*.diff), where the
  # generic-api-key entropy rule mistakes them for credentials. They are schema
  # identifiers from public open-source pull requests, not secrets.
  '''_hyper_\d+_\d+_chunk''',
]
