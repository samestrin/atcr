# DRAFT catalog entry for kunchenguid/axi `catalog.yaml`, `community` list.
#
# This file is a draft, not a submission. Nothing here has been sent to
# kunchenguid/axi. The owner submits it (the PR is public).
#
# In kunchenguid/axi, `catalog.yaml` is the single source of truth: the README
# and docs tables are generated from it, and `docs:check` fails on a
# hand-edited generated region. No CI, tag or release action in this repo
# follows from this file; that PR is the whole task.
#
# Steps the owner runs:
#   1. Fork kunchenguid/axi, then clone kunchenguid/axi itself (or set the
#      clone's origin back to git@github.com:kunchenguid/axi.git), as upstream
#      CONTRIBUTING.md says: `no-mistakes --fork-url` below depends on origin
#      being the parent. Branch from main.
#   2. Append the `- name: atcr` entry below (without these comments) to the
#      `community` list in catalog.yaml as it stands: it is already indented
#      two spaces, like the other community items.
#   3. Check `reviewed_revision` is still the latest release commit (see
#      note below).
#   4. Run `pnpm run docs:gen` to regenerate README.md and docs/index.html, and
#      commit all three files (catalog.yaml, README.md, docs/index.html)
#      together (CI `docs:check` fails on drift).
#   5. Push through the `no-mistakes` gate (`no-mistakes init --fork-url
#      git@github.com:<you>/axi.git`, then `git push no-mistakes`; v1.30.1 or
#      newer for forks). It runs the pipeline and opens the PR.
#
# `reviewed_revision` below is the v1.3.0 release commit (27104003, tag v1.3.0,
# #922); docs/axi-audit.md was re-checked there, and every file:line below
# describes that tree. Repo PRs are squash-merged, so if a later release moves
# the pin, re-check docs/axi-audit.md on the new tagged commit and replace both.
# One citation is by symbol rather than line: the legacy-pipe branch of
# writeReviewHelp in cli/review.go (lines 1284-1286 at v1.3.0), because a change
# after the release moved it on main, where the citation guard checks lines.
#
# The exceptions below are numbered as in docs/axi-audit.md; that file is the
# evidence for every claim here, and the two must not drift apart. When the
# audit's last line reads `Unjustified gaps: <n>` with n above 0 (it reads
# `Unjustified gaps: 10` at this revision), `status` stays `exception` and
# every one of those gaps is named in `exception`.
  - name: atcr
    url: https://github.com/samestrin/atcr
    author: samestrin
    domain: Code review / Multi-model panel
    description: "Fans a git range, branch or whole-repository scan out to a panel of heterogeneous LLM reviewers and deterministically reconciles their findings into one deduplicated, confidence-scored report, with TOON payloads on its AXI surfaces for an agent to consume."
    admission:
      status: exception
      reviewed_revision: 27104003cd0ee30111f3aa9cf0cb651136a59927
      reviewed_components:
        - README.md
        - go.mod
        - docs/axi-audit.md
        - docs/agentic-consumption.md
        - docs/skill-usage.md
        - skills/atcr/SKILL.md
        - cli/main.go
        - cli/axi.go
        - cli/home.go
        - cli/review.go
        - cli/resume.go
        - cli/report.go
        - cli/suggestions.go
        - cli/status.go
        - cli/reconcile.go
        - cli/verify.go
        - cli/debate.go
        - cli/debt_add.go
        - cli/debt_clean.go
        - cli/debt_dashboard.go
        - cli/debt_filter.go
        - cli/debt_group.go
        - cli/debt_report.go
        - cli/debt_resolve.go
        - cli/debt_validate.go
        - cli/quickstart.go
        - cli/version.go
        - cli/skill.go
        - internal/report/standard_axi.go
        - internal/report/render.go
        - internal/report/pagination.go
        - internal/report/legacy_pipe.go
      source_observations:
        - "docs/axi-audit.md marks principles 4, 5 and 8 met; 1, 3, 6, 9 and 10 met with stated exceptions; and 2 and 7 unmet. Every paginated findings payload carries `total` and `truncated` after its array (internal/report/pagination.go:109-136; TestRenderAXIPaginated_HeaderNEqualsEmittedRows), an empty result encodes as `findings[0]` with `total: 0` and `truncated: false` (the `paginated_empty` golden in TestStandardAXI_Goldens), and empty debt selections are non-nil empty arrays (cli/debt_filter.go:146-149; TestDebtFilter_EmptyStoreEmitsEmptyItems, TestDebtClean_EmptyStore, TestDebtGroup_EmptyStore)."
        - "A bare `atcr` prints live data, not help: under `--axi` one TOON row of exec_path, description, review_id and review_status, with the home directory as `~`, review_status `none` on a first run, and a `help[]` next-step block; exit 0 either way (cli/home.go:145-168, internal/report/standard_axi.go:199-201; TestRootCmd_BareInvocationShowsHomeView, TestRootCmd_BareAXIRendersHomeViewPayload, TestRootCmd_BareAXIEndsWithHelpBlock). The human view is the same live state, not static help."
        - "TOON is opt-in, not the default: `--axi` on bare atcr, review, review --resume, reconcile, verify, debate, status, debt clean/filter/group/validate, and `report --format axi` on the report's existing format enum; the default stays Markdown for report and human text or JSON elsewhere (cli/main.go:582-590, cli/report.go:28-37; TestRootCmd_AXIFlagRegisteredOnRoot, TestReportCmd_DefaultFormatAndOutputFile). AXI payloads are canonical TOON through goaxi.EncodeChecked with go-axi v0.4.0 pinned (internal/report/standard_axi.go:31-56, go.mod:40; TestRenderAXI_StandardTOONRoundTrip, TestRenderSingleRowAXI_StandardTOON). The exception is the deprecated, opt-in legacy pipe mode (`ATCR_LEGACY_PIPE=1`, `--legacy-pipe`, `report --format pipe`): its pipe encoding replaces TOON and `help[]` on review, report and the home view, the findings carry their total in the header rather than a `total` line, and it warns on stderr (cli/axi.go:49-67, cli/main.go:590, cli/report.go:160, internal/report/legacy_pipe.go:125, cli/home.go:162-165, and the legacyPipeFromContext branch of writeReviewHelp in cli/review.go)."
        - "Next-step disclosure rides stdout as a TOON `help[]` block on the home view, review/resume, report, reconcile, verify, debate and status, generated from a suggestion registry that keeps `<id>` placeholders and allowlists only disambiguating flags. The steps follow the review's state so none exits 2 for want of data: review offers `report` and `verify`, and status offers `report`, only once the review has reconciled data (`reconcile <id>` until then); a pending or failed review is offered `review --resume <id>` carrying its recorded `--base`/`--head` or `--merge-commit` range (and `status <id>` after a failed review, whose `help[]` still follows its run summary); and the home view offers `report <id>` only when the latest review has reconciled data, so a first run gets `atcr review` alone (suggestionRegistry, nextStep.offered, recordedRangeFlags and writeAXIHelp: cli/suggestions.go:89-136, cli/suggestions.go:189-200, cli/suggestions.go:154-175, cli/suggestions.go:332-342; TestSuggestions_ReconcileStateGatesSteps, TestSuggestions_ResumeCarriesRecordedRange, TestSuggestions_HomeOffersReportOnlyWhenReconciled, TestReviewCmd_FailedRangeReviewSuggestsRunnableResume, TestReviewCmd_AXIEndsWithHelpBlock, TestReportCmd_AXIEndsWithHelpBlock, TestReconcileCmd_AXI, TestVerifyCmd_AXI, TestDebateCmd_AXI, TestStatusCmd_AXIPendingOffersResume). Human `Next:` lines are not an AXI leak: one representation is chosen, and the AXI tests assert no stderr `Next:`."
        - "Exit codes are 0 success, 1 failure or gate, 2 usage or configuration, 3 sync-cloud authentication, and they do not change with output shape (cli/main.go:238-265; TestAXIExitParity_CleanReviewExitsZero, TestAXIExitParity_GateFailureExitsOne, TestAXIExitParity_UsageErrorExitsTwo, TestAXIExitParity_AuthErrorExitsThree). A malformed invocation fails loudly before command work as a usage error (cli/main.go:592-596; TestRootCmd_UnknownSubcommandIsUsageError, TestReportCmd_InvalidFormatIsUsageError), and a completed reconcile keeps its payload when its gate exits 1 (TestReconcileCmd_AXIGateFailureStillEmits). Two non-AXI commands add exit 4: debt dashboard --check and debt report --check report drift or a missing target with it (cli/debt_dashboard.go:276, cli/debt_dashboard.go:298-307, cli/debt_report.go:88-89), outside the AXI contract."
        - "AXI calls are non-interactive and keep the streams separate: stdout is only the payload, and failures are plain diagnostics on stderr, not structured documents on stdout (cli/main.go:157-162, cli/main.go:250-259; TestStatusCmd_AXIMissingReview). A fully complete review resume re-reconciles and exits 0, and repeated debt resolution neither errors nor appends another record (TestResume_AllCompleteReconcilesAndExitsZero, TestDebtResolve_MarkResolvedIsIdempotent)."
        - "Truncation is explicit where it exists: findings free-text cells are cut at 500 runes (internal/report/render.go:41-43, internal/report/standard_axi.go:161-170; TestAXIText_SanitizesBeforeTruncating), and the findings array is capped at 500 lines by default with ATCR_AXI_MAX_LINES as the override, rows dropped before encoding so the header count equals the rows present and the true total sits on the `total` line (internal/report/pagination.go:112-136, cli/main.go:696-732; TestReportCmd_AXITruncatesAtEnvCap, TestReportCmd_AXIUnderCapNotTruncated, TestAXIMaxLinesFromEnv)."
        - "An installable Agent Skill ships for Claude Code, Codex, Kimi, OpenCode, Antigravity and the vendor-neutral agents layout (cli/skill.go:44-51, docs/skill-usage.md:13-56; TestSkillExport_UnknownHarnessIsAUsageError), and it rightly omits live state (skills/atcr/SKILL.md:14), but SKILL.md is written by hand rather than generated from the no-argument home view, with no `--check` step to fail CI when it drifts; no `setup` command, SessionStart hook or OpenCode plugin injects the live home view; the root registers `skill`, not `setup` (cli/main.go:593-623); the skill's command examples assume atcr is already on PATH (skills/atcr/SKILL.md:20) rather than offering a form that runs without a global install; and its trigger description (skills/atcr/SKILL.md:3) runs 645 characters listing all 29 routed commands before its `Use when` clause, rather than the terse, outcome-focused trigger the principle asks for."
        - "Version discovery is partially there: `--version` and the `version` subcommand share atcrVersion and agree, but every form prints `atcr version <version>` rather than the bare version and `-V` is rejected with exit 2 (cli/main.go:430-431, cli/version.go:18-55; TestVersion_FlagAndSubcommandAgree, real-binary probes). All 71 visible command paths (the root, 64 command paths and six `help`/`completion` paths) answered `--help` with exit 0, but concise references such as `status --help` omit the required two-to-three usage examples (cli/main.go:593-623; real-binary probe)."
        - "Provider-backed review and resume success paths were exercised through fake-endpoint tests, not a paid live review; version latency was not benchmarked, because the AXI source's ESM dynamic-import remedy is Node-specific and atcr reads build metadata through runtime/debug (cli/version.go:23-41). No live sync-cloud service or interactive TTY was used."
        - "Nothing on an AXI surface prompts, and the only wizards left are human-only: `debt add` and `quickstart` keep optional TTY flows and neither prompts off a TTY: `debt add` provides a complete flag route that fails immediately, and `quickstart` skips its API-key prompt and prints the export hint (cli/debt_add.go:103-134, cli/debt_add.go:204-253, cli/quickstart.go:377-380; TestDebtAdd_MissingRequiredNonTTYIsUsageError, TestQuickstart_StdinNotTTY_SkipsKeyPrompt)."
      exception: "Fourteen exceptions, numbered as in docs/axi-audit.md: four justified tradeoffs and ten unjustified gaps. Justified: (1) TOON is opt-in through --axi or --format axi, keeping the human and JSON defaults, and a deprecated opt-in pipe encoding replaces TOON and help[] on review, report and home and warns on stderr; (6) AXI failures remain plain diagnostics on stderr, so stdout is only ever a payload; (7) AXI retains atcr's additional exit 3 for sync-cloud authentication failure, which CI already branches on; (14) human-only debt add and quickstart retain optional TTY wizards. Unjustified: (2) no AXI surface offers --fields or a three-to-four-field list projection; (3) AXI findings cells are cut to 500 runes with no size or full-content hint; (4) a row-truncated findings payload reports total and truncated but its help[] never names ATCR_AXI_MAX_LINES, so principle 9's truncated list is not revealed either; (5) debt clean, filter, and group put complete problem and fix strings in list rows; (8) unknown flags exit 2 but name neither the command's valid flags nor a replacement; (9) no setup command, SessionStart hook, or OpenCode plugin; SKILL.md is hand-written, not generated from the home view, with no --check step; the skill's examples need atcr on PATH; and its 645-character description lists all 29 routed commands rather than a terse, outcome-focused trigger; (10) the four debt AXI renderers return with no help[]; (11) -V is rejected with exit 2; (12) version forms print 'atcr version <version>', not the bare version; (13) concise references such as status --help omit the two-to-three usage examples."
