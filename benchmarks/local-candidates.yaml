# Local model candidates for epic 113: the profile each candidate is
# benchmarked with, so a score measures the model and not a bad setup.
#
# Benchmark input only. The quickstart preset (cli/quickstart.go) keeps just
# the picks. internal/benchmark/local_candidates_test.go checks every entry.
#
# Fields:
#   ollama_tag      the exact Ollama tag, quantization pinned (not :latest)
#   hf_id           the upstream Hugging Face repository
#   quantization    the weight format of ollama_tag
#   size_gb         the pull size of ollama_tag in GB (the sum of its manifest
#                   layers on registry.ollama.ai, 2026-11-14). Weights only:
#                   the KV cache for the review context comes on top, so a fit
#                   on a tier is the operator's measurement, not this number.
#   min_ollama      the Ollama version the model's manifest requires
#   tiers           gpu-32gb (32 GB GPU, ai.lan RTX 5090) and/or unified-64gb
#                   (64 GB unified memory, macmini-m4). Ollama serves both
#                   tiers (refine answer Q2).
#   chat_template   where the chat template comes from, and what breaks it
#   stop_tokens     how generation stops
#   thinking_model  the model has a thinking mode (ollama.com "thinking" tag)
#   thinking_style, thinking, thinking_level, max_tokens
#                   the registry agent fields the candidate runs with
#                   (docs/registry.md). A thinking model runs with thinking on
#                   at its best-practice level and max_tokens >= 16384 (refine
#                   answer Q5): the 8192 default starves a thinking model.
#
# Ollama's /v1/chat/completions reads reasoning_effort for every thinking
# model (docs/api/openai-compatibility in ollama/ollama), so every thinking
# candidate here uses thinking_style reasoning_effort. Confirm it per model
# with `atcr doctor` before scoring (the thinking verdict, docs/registry.md).

version: 1
candidates:
  - name: qwen3.8-27b
    ollama_tag: qwen3.8:27b-q4_K_M
    hf_id: Qwen/Qwen3.8-27B
    architecture: dense
    params_b: 27.3
    quantization: Q4_K_M
    size_gb: 17.74
    min_ollama: 0.32.12
    tiers: [gpu-32gb, unified-64gb]
    chat_template: >-
      Ollama's built-in qwen3.8 renderer and qwen3.5 parser (the manifest
      carries no Go template). Needs Ollama 0.32.12 or later; an older Ollama
      cannot load the model.
    stop_tokens: >-
      Set by the renderer (<|im_end|>); the manifest carries no stop list.
      The parser splits the <think> block into the reasoning field.
    thinking_model: true
    thinking_style: reasoning_effort
    thinking: "on"
    thinking_level: high
    max_tokens: 32768
    notes: >-
      Thinking is on by default. bench36 scored it 0.6 findings per case at
      the 8192 default cap, which fits thinking-token starvation, not model
      quality.

  - name: gemma4-31b
    ollama_tag: gemma4:31b-it-q4_K_M
    hf_id: google/gemma-4-31B-it
    architecture: dense
    params_b: 30.7
    quantization: Q4_K_M
    size_gb: 20.39
    min_ollama: 0.30.9
    tiers: [gpu-32gb, unified-64gb]
    chat_template: >-
      The manifest template is a bare {{ .Prompt }}; the real chat format
      comes from Ollama's built-in gemma4 renderer and parser. A stack that
      does not apply the renderer (an Ollama older than 0.30.9, or a raw
      completion call) sends the prompt with no turn markers.
    stop_tokens: >-
      Set by the gemma4 renderer; the manifest carries no stop list.
    thinking_model: true
    thinking_style: reasoning_effort
    thinking: "on"
    thinking_level: high
    max_tokens: 32768
    notes: >-
      bench36 got about 4 tokens per reply. The bare manifest template makes
      a missing renderer the first thing to rule out; the smoke check (T2)
      stops the candidate if it still replies near-empty.

