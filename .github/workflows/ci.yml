name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Go Lint & Test
    runs-on: ubuntu-latest

    env:
      # This job is the ONLY thing that builds the root module against the
      # reconcile version go.mod:38 actually pins. That coverage exists today by
      # accident, not by design: `go.work` (`use . ./reconcile`) is gitignored
      # (.gitignore:19), so a fresh checkout simply has none and the build falls
      # through to go.mod + go.sum. Commit a go.work, or add a step that
      # generates one, and the coverage evaporates with nothing failing to say
      # so — the root would compile against the WORKING TREE copy of reconcile
      # and a reference to an unreleased symbol would ship green.
      #
      # GOWORK=off makes it a guarantee instead of a side effect. It is a no-op
      # against today's checkout, which is the point: it costs nothing and it
      # cannot be silently removed. .githooks/pre-push:70 runs the same thing
      # explicitly for the local case.
      #
      # It catches only the compile-detectable drift class (a symbol missing
      # from the pin). Drift in the BEHAVIOR behind an unchanged signature — an
      # unexported predicate widened in-tree — compiles clean either way and is
      # governed by release discipline (docs/release-process.md), not by CI.
      GOWORK: "off"

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          # Cache on: these are ephemeral GitHub-hosted runners, so setup-go's
          # module/build cache (GOMODCACHE/GOCACHE via the Actions Cache) avoids
          # re-downloading deps and recompiling from scratch on every run.
          cache: true

      - name: Verify Formatted
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files must be formatted with gofmt. Run: go fmt ./..."
            gofmt -d .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          # Single pinned version shared with reconcile-module.yml and the root
          # .golangci.yml so a tag cannot pass locally but fail in CI (or vice versa).
          version: v2.12.2

      - name: Run Tests
        # -race now runs on pull_request too, because it no longer runs anywhere
        # else before merge: .githooks/pre-push dropped it after `go test -race
        # ./...` from a working checkout was observed corrupting the repository
        # (rewritten branch ref, ~200 stray fixture commits, core.bare flipped).
        # CI is the right home for it — the checkout is ephemeral, so the same
        # failure mode is harmless here.
        #
        # The original concern was cost, and most of that was -coverprofile,
        # which disables Go's test cache. Coverage is only consumed by the
        # post-merge upload, so PRs get -race WITHOUT it and stay cached.
        #
        # -timeout 20m because internal/astgroup runs ~5x slower under -race and
        # overruns Go's 10m default, which surfaces as a panic rather than a
        # useful failure. Both paths get it: the post-merge job runs the same
        # suite with coverage on top and is strictly slower.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            go test -race -timeout 20m ./...
          else
            go test -v -race -timeout 20m -coverprofile=coverage.out ./...
          fi

      - name: Surface reconcile release-lag skip
        # TestReconcileModule_ReleasedVocabularyMatchesInTree reports a pending
        # reconcile release with t.Skip, and a skip renders as a green `ok` in
        # the suite run above — a skip and a pass are indistinguishable in
        # `go test` output (the hazard the sandbox proof job below documents).
        # Re-run just that test verbosely and annotate when the skip fires, so a
        # lagging go.mod pin is visible on the run instead of silent. The lag is
        # an expected release-window state, so this warns rather than fails.
        # The step is only worth anything if that test actually ran, so assert
        # that it did rather than enumerating the ways it might not have.
        # `go test` exits 0 for BOTH ways it can silently disarm: a renamed or
        # moved test makes the -run pattern match nothing ("testing: warning: no
        # tests to run"), and a package with no _test.go files at all prints
        # "[no test files]" instead — a different string, so a check written
        # against the first one passes the second straight through. A positive
        # "--- PASS:"/"--- SKIP:" assertion on the test's own name covers both,
        # and any future third way, without needing to name any of them.
        run: |
          out=$(go test ./internal/reconcile/ -run TestReconcileModule_ReleasedVocabularyMatchesInTree -v -count=1 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if ! echo "$out" | grep -q -- "--- PASS: TestReconcileModule_ReleasedVocabularyMatchesInTree\|--- SKIP: TestReconcileModule_ReleasedVocabularyMatchesInTree"; then
            echo "release-lag guard did not run — was TestReconcileModule_ReleasedVocabularyMatchesInTree renamed, moved, or its package stripped of tests?"
            exit 1
          fi
          if echo "$out" | grep -q "in-tree reconcile vocabulary is ahead"; then
            echo "::warning::the in-tree reconcile vocabulary is ahead of the released module pinned in go.mod — release reconcile and bump the pin"
          fi

      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push'
        continue-on-error: true # non-essential: a storage-quota/upload failure must not fail CI
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 7

  # Full-tree secret scan. The pre-commit hook also runs gitleaks, but it is
  # opt-in (`git config core.hooksPath .githooks`), silently skipped when the
  # binary is absent, and scans only `--staged` changes — so an already-committed
  # secret, or a contributor without the hook, is caught nowhere. This job is
  # what actually enforces .gitleaks.toml, and what keeps its allowlist entries
  # honest: remove one and this goes red.
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install gitleaks
        # Built from a pinned source version rather than a floating action tag,
        # matching how every other tool here is pinned. The module's declared
        # path is still the pre-rename zricethezav one.
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan working tree
        # `dir`, not `git`: this scans the checked-out tree, so it covers files
        # committed before this job existed instead of only the current diff.
        # --redact keeps any real finding out of the public log.
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact

  # PR-time coverage for the nested ./reconcile module. The `ci` job above runs
  # `go test ./...` and golangci-lint from the repo root, and NEITHER crosses
  # ./reconcile's go.mod boundary — so without this dedicated job a library
  # regression is invisible until the next module-release tag.
  #
  # mirrors: .github/workflows/reconcile-module.yml — this job runs the SAME three
  # checks as the release gate (gofmt, golangci-lint, go test -race), deliberately.
  # Keep the two in lockstep: a check that exists in only one of them is the defect
  # this pairing exists to prevent, not an optimization.
  #
  # It ran `go test` alone until 2026-08-10, on the rationale that skipping lint
  # kept PR feedback fast. Measured on this module that saved ~2s (gofmt 0.02s,
  # golangci-lint 0.17s warm / 0.75s cold, go test -race 1.3s) inside a job that
  # already spends longer than that provisioning Go — while letting a deprecated
  # parser.ParseDir call merge clean and fail only on the release tag, mid-release.
  # Do not re-trim this job for speed without re-measuring; the numbers, not the
  # intuition, are the reason it is shaped this way.
  reconcile-module:
    name: Reconcile Module Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./reconcile

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          # cache on for ephemeral hosted runners (see the `ci` job)
          cache: true

      - name: Verify Formatted
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files must be formatted with gofmt. Run: go fmt ./..."
            gofmt -d .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          # Same pinned version and shared root config as the `ci` job and
          # reconcile-module.yml, so a module change cannot pass one and fail another.
          version: v2.12.2
          working-directory: ./reconcile
          args: --timeout 5m --config ../.golangci.yml

      - name: Run Module Tests
        # root `go test ./...` does NOT cross ./reconcile's go.mod boundary
        run: go test -race ./...

  # PR-time coverage for the FOUR nested wasm parser modules under
  # internal/astgroup/parsers/src/ — guestabi (the shared guest ABI), goparser,
  # pyparser, and braceparser. Each has its own go.mod, so neither the root
  # `go test ./...` nor the root golangci-lint reaches any of them.
  #
  # Until 2026-08-10 only braceparser had a job, and it ran `go test` alone:
  # goparser, pyparser and guestabi had NO CI of any kind, so a source change that
  # did not compile for wasip1 was caught by nothing until somebody ran
  # parsers/build.sh by hand. This job covers all four with one check set.
  #
  # Two things it deliberately does NOT do:
  #   - It does not rebuild the .wasm binaries. They are committed by design
  #     (build.sh is not part of CI, and needs no toolchain beyond Go), and their
  #     integrity is verified by TestEmbeddedParsersMatchManifest in the root job.
  #   - It does not lint braceparser. That module has one pre-existing staticcheck
  #     finding (QF1001 in parse_core.go), and correcting it means regenerating the
  #     8 brace-language .wasm files — ~24 MB of binary churn — so it belongs in a
  #     dedicated change alongside a build.sh run, tracked in the TD README. The
  #     other three modules ARE linted and are clean.
  #
  # Everything is built for GOOS=wasip1 GOARCH=wasm because that is the only target
  # these modules are ever compiled for (build.sh), and braceparser additionally
  # needs a language build tag: `active` is selected at compile time by
  # active_<lang>.go, so a bare `go build ./...` fails with "undefined: active".
  # All 8 languages are built, since a config-table change can break exactly one.
  parser-modules:
    name: Wasm Parser Modules
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GOOS: wasip1
      GOARCH: wasm
      # The modules declare `go 1.26`; pin the toolchain so an implicit download
      # cannot silently swap compilers, matching parsers/build.sh.
      GOTOOLCHAIN: local

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          # cache on for ephemeral hosted runners (see the `ci` job)
          cache: true

      - name: Verify Formatted
        working-directory: ./internal/astgroup/parsers/src
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files must be formatted with gofmt. Run: go fmt ./..."
            gofmt -d .
            exit 1
          fi

      - name: Build guestabi, goparser, pyparser
        working-directory: ./internal/astgroup/parsers/src
        run: |
          for m in guestabi goparser pyparser; do
            echo "::group::go vet + go build $m"
            # -o /dev/null: goparser and pyparser are main packages, so a bare
            # `go build ./...` drops an executable in the module directory.
            ( cd "$m" && go vet ./... && go build -o /dev/null ./... )
            echo "::endgroup::"
          done

      - name: Build braceparser for every language tag
        working-directory: ./internal/astgroup/parsers/src/braceparser
        run: |
          for tag in bash cpp csharp java kotlin php rust ts; do
            echo "::group::go vet + go build -tags $tag"
            go vet -tags "$tag" ./...
            go build -tags "$tag" -o /dev/null ./...
            echo "::endgroup::"
          done

      - name: Run braceparser tests
        working-directory: ./internal/astgroup/parsers/src/braceparser
        # Host-native, not wasip1: the scanner tests exercise plain Go and there is
        # no wasm test runner on the runner. braceparser is the only one of the four
        # with tests.
        env:
          GOOS: ''
          GOARCH: ''
        run: go test ./...

      # One action invocation per module: golangci-lint-action takes a single
      # working-directory, and using the action (not a bare binary) keeps the
      # pinned v2.12.2 and the shared root config identical to the `ci` and
      # `reconcile-module` jobs. braceparser is absent by design — see the header.
      - name: Run golangci-lint (guestabi)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2
          working-directory: ./internal/astgroup/parsers/src/guestabi
          args: --timeout 5m --config ../../../../../.golangci.yml

      - name: Run golangci-lint (goparser)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2
          working-directory: ./internal/astgroup/parsers/src/goparser
          args: --timeout 5m --config ../../../../../.golangci.yml

      - name: Run golangci-lint (pyparser)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2
          working-directory: ./internal/astgroup/parsers/src/pyparser
          args: --timeout 5m --config ../../../../../.golangci.yml

  # ---------------------------------------------------------------------------
  # OS-level sandbox containment proofs.
  #
  # These are the ONLY tests that prove the kernel actually enforces the os-level
  # sandbox. Every other test asserts the SHAPE of a generated profile or argv,
  # and a perfectly-shaped profile can contain nothing — so until these ran in CI,
  # a containment regression could reach main with the suite green.
  #
  # They are split by platform because the suites are, via build tags:
  # `integration && darwin` (sandbox-exec) and `integration && linux` (bwrap). A
  # single job cannot cover both, and neither runs at all without -tags integration.
  #
  # ATCR_REQUIRE_OSLEVEL_SANDBOX_PROOF=1 turns skipOrFail's skips into failures: a
  # skip and a proof are indistinguishable in `go test` output (both render as a
  # green package), and these runs are being taken as AC 02-03/02-04 sign-off.
  # ---------------------------------------------------------------------------

  integration-macos:
    name: OS-Level Sandbox Proof (macOS)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true

      # actions/setup-go installs into the runner's hosted-tool-cache
      # (/Users/runner/hostedtoolcache/go/...), which is outside the sandbox
      # profile's darwinSystemReadDirs/vettedToolchainPrefixes allowlist — by
      # design, per docs/auto-fix.md's documented limitation that a toolchain
      # outside the vetted tiers is invisible inside the sandbox even though
      # PATH still resolves it on the host. TestIntegration_OSLevelDarwin_
      # RealToolchainRuns/go spawns `go version` AS THE SANDBOXED WORKLOAD (the
      # outer `go test` driving this job is unaffected), so that specific `go`
      # needs to live under an already-vetted prefix. Copying it into
      # /usr/local/go (vetted) is a per-job step on this ephemeral runner, not
      # a change to the sandbox's trust boundary.
      - name: Relocate Go under a sandbox-vetted prefix
        run: |
          set -euo pipefail
          sudo rsync -a "$(go env GOROOT)/" /usr/local/go/
          sudo ln -sf /usr/local/go/bin/go /usr/local/bin/go
          echo "GOROOT=/usr/local/go" >> "$GITHUB_ENV"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      # No install step: sandbox-exec ships in the macOS runner base image.
      - name: Run containment proof
        env:
          ATCR_REQUIRE_OSLEVEL_SANDBOX_PROOF: '1'
        run: |
          set -o pipefail
          go test -tags integration -v ./internal/sandbox/... ./internal/verify/ 2>&1 | tee proof.log

      - name: Assert the proof actually ran
        run: |
          # The guard that makes this job meaningful. `go test` reports ok for a
          # package whose tagged files were all excluded, or whose -run filter
          # matched nothing — so a green job is NOT by itself evidence that any
          # containment test executed. Count the passes.
          # 8 is a floor, not a count. macOS carries 14 proofs and Linux 15
          # (10/11 platform + 4 shared); if a platform's build tag broke and its
          # whole file were excluded, only the 4 shared ones would run. 8 catches
          # that while leaving room for legitimate test churn.
          n=$(grep -c '^--- PASS: TestIntegration_' proof.log || true)
          echo "integration proofs passed: $n"
          if [ "$n" -lt 8 ]; then
            echo "::error::Expected at least 8 TestIntegration_* passes, saw $n — the containment proof did not run."
            exit 1
          fi

  integration-linux:
    name: OS-Level Sandbox Proof (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Permit unprivileged user namespaces
        # Ubuntu 24.04 (what ubuntu-latest resolves to) ships
        # kernel.apparmor_restrict_unprivileged_userns=1 by default, so an
        # unprivileged bwrap dies at "setting up uid map: Permission denied" and
        # the whole leg would skip rather than prove anything.
        #
        # This is the SAME restriction that blocks the proof on orchestrator.lan,
        # where installing a persistent AppArmor profile was ruled out. A GitHub
        # Actions VM is neither shared nor long-lived — it is destroyed with the
        # job — so the objection that applied there does not apply here.
        #
        # The distro profile is preferred (it keeps the restriction ON for
        # everything except bwrap); the sysctl is the fallback when the
        # extra-profiles package layout differs. Which one was used is echoed, so
        # a silent downgrade to the blunter mechanism is visible in the log.
        run: |
          set -euo pipefail
          sudo apt-get install -y apparmor-profiles apparmor-utils
          PROFILE=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [ -f "$PROFILE" ]; then
            echo "using distro AppArmor profile: $PROFILE"
            sudo install -m 0644 "$PROFILE" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          else
            echo "AppArmor profile not found at $PROFILE; falling back to the sysctl"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Verify unprivileged bwrap works
        # Fail fast and unambiguously if the step above did not take, instead of
        # surfacing later as an opaque containment-test failure. Deliberately NOT
        # run under sudo: unprivileged operation is the property under test.
        run: bwrap --ro-bind / / --unshare-all /bin/true

      - name: Run containment proof
        # Also unprivileged. Running the suite as root would re-create exactly the
        # gap this job exists to close (AC 02-04 was signed off on a root-only run).
        env:
          ATCR_REQUIRE_OSLEVEL_SANDBOX_PROOF: '1'
        run: |
          set -o pipefail
          go test -tags integration -v ./internal/sandbox/... ./internal/verify/ 2>&1 | tee proof.log

      - name: Assert the proof actually ran
        run: |
          # 8 is a floor, not a count. macOS carries 14 proofs and Linux 15
          # (10/11 platform + 4 shared); if a platform's build tag broke and its
          # whole file were excluded, only the 4 shared ones would run. 8 catches
          # that while leaving room for legitimate test churn.
          n=$(grep -c '^--- PASS: TestIntegration_' proof.log || true)
          echo "integration proofs passed: $n"
          if [ "$n" -lt 8 ]; then
            echo "::error::Expected at least 8 TestIntegration_* passes, saw $n — the containment proof did not run."
            exit 1
          fi
